<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración inicial · Clínica Dental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF8F4;--ink:#1E2A28;--primary:#2F6F62;--primary-dark:#204E45;--accent:#E1734F;--accent-dark:#C85E3B;--border:#DFE5E1;--muted:#7C8B87;--danger:#C0463C;--danger-light:#FBEAE8;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--primary-dark);font-family:'Inter',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;border-radius:20px;padding:34px 32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  h1{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px 0;}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 22px 0;line-height:1.5;}
  label{display:block;font-size:12px;font-weight:600;color:var(--primary-dark);margin-bottom:5px;}
  input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:14px;font-size:14px;margin-bottom:14px;}
  input:focus{outline:none;border-color:var(--primary);}
  button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{background:var(--accent-dark);}
  .error{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:12px;margin-bottom:14px;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:-8px;margin-bottom:14px;}
</style>
</head>
<body>
  <div class="card">
    <h1>🦷 Bienvenido</h1>
    <p class="sub">Es la primera vez que se usa el sistema. Crea la cuenta de administrador para proteger el acceso a los datos de los pacientes.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="activation_code">Código de activación</label>
      <input type="text" id="activation_code" name="activation_code" required autofocus>
      <div class="hint">Te lo entrega quien te dio este programa.</div>
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      <div class="hint">Mínimo 8 caracteres.</div>
      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" name="confirm" required>
      <button type="submit">Crear cuenta y continuar</button>
    </form>
  </div>
</body>
</html>
